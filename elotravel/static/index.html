<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELOTRAVEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap">
<!-- Bundled locally (marked 12.0.2, MIT; DOMPurify 3.1.6, Apache-2.0/MPL-2.0) so the page works without CDN access. -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
  /* Near-monochrome, warm off-white, black pill controls, light large numerals,
     small grey labels over values, vertical route timelines, warm imagery. */
  :root {
    --bg: #f3f2ef; --surface: #fbfbf9; --tile: #f1f0ec; --ink: #151517; --muted: #87868b;
    --line: #e3e1dc; --pill: #151517; --on-pill: #fbfbf9; --good: #2f7d5b; --bad: #b3412e; --fee: #a0631c;
    --font: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f10; --surface: #18181a; --tile: #202022; --ink: #f2f1ee; --muted: #8f8e93;
      --line: #2b2b2e; --pill: #f2f1ee; --on-pill: #151517; --good: #6fcf9f; --bad: #ef8a76; --fee: #e2a65e; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  a { color: inherit; }

  .wrap { max-width: 720px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .top { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 10px; }
  .logo { font-weight: 600; font-size: 17px; letter-spacing: .01em; }
  .logo b { font-weight: 300; }

  .hero { position: relative; border-radius: 22px; overflow: hidden; min-height: 180px; padding: 26px 20px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 7px),
      radial-gradient(120% 60% at 70% 62%, rgba(255,196,120,.85), transparent 60%),
      linear-gradient(180deg, #2a1d17 0%, #5b3b29 38%, #b57744 58%, #6d4a35 76%, #33251e 100%);
    color: #fbf6ef; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 14px; }
  .hero h1 { margin: 0; font-weight: 300; font-size: 30px; line-height: 1.15; text-wrap: balance; }

  #log { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
  .me { align-self: flex-start; max-width: 85%; background: var(--pill); color: var(--on-pill); border-radius: 18px; padding: 11px 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { max-width: 96%; overflow-wrap: anywhere; }
  .bot p { margin: 0 0 .5em; } .bot p:last-child { margin: 0; }
  .bot a { text-decoration: underline; }
  .status { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
  .status .step { display: flex; gap: 8px; align-items: center; }
  .status .step::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); flex: none; }
  .status .step:last-child::before { animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .status .step:last-child::before { animation: none; } }
  .error { border-color: var(--bad); color: var(--bad); }

  /* Package card */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { font-size: 12px; color: var(--muted); margin: 0 0 2px; }
  .card h2 { margin: 0; font-size: 18px; font-weight: 500; text-wrap: balance; }
  .total { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .big { font-weight: 300; font-size: 42px; line-height: .95; letter-spacing: -.02em; }
  .total .note { font-size: 13px; color: var(--muted); text-align: end; }
  .total .note b.ok { color: var(--good); font-weight: 500; }
  .total .note b.over { color: var(--bad); font-weight: 500; }
  .meter { height: 2px; background: var(--line); position: relative; }
  .meter span { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--ink); max-width: 100%; }
  .meter.over span { background: var(--bad); }
  .block { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  .block-title { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
  .carrier { display: flex; align-items: center; gap: 10px; }
  .carrier img, .mono { width: 36px; height: 36px; border-radius: 10px; background: var(--tile); object-fit: contain; flex: none; }
  .mono { display: grid; place-items: center; font-weight: 600; font-size: 12px; }
  .carrier div { display: flex; flex-direction: column; min-width: 0; }
  .carrier b { font-weight: 500; }
  .carrier small { color: var(--muted); font-size: 12px; }
  .leg-label { font-size: 12px; color: var(--muted); }
  .route { display: grid; grid-template-columns: 14px 1fr auto; column-gap: 12px; }
  .route .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); justify-self: center; margin-top: 7px; }
  .route .rail { width: 1px; background: var(--ink); justify-self: center; }
  .route .rail.dashed { background: none; border-inline-start: 1px dashed var(--muted); width: 0; }
  .route .place { display: flex; flex-direction: column; min-width: 0; }
  .route .place b { font-weight: 500; }
  .route .place small { color: var(--muted); font-size: 12px; }
  .route .time { text-align: end; font-weight: 500; }
  .route .time small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .route .dur { grid-column: 2 / 4; color: var(--muted); font-size: 12px; padding-block: 6px 10px; }
  .sep { height: 1px; background: var(--line); }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .t { background: var(--tile); border-radius: 14px; padding: 10px 8px 12px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .t small { font-size: 11px; color: var(--muted); }
  .t span { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
  .t .price { font-weight: 300; font-size: 21px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
  .chip.fee { color: var(--fee); border-color: currentColor; }
  .photo { border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 10; background: var(--tile); max-width: 100%; position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .badge { position: absolute; top: 10px; inset-inline-end: 10px; background: rgba(21,21,23,.72); color: #fbfbf9; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .hotel { display: flex; flex-direction: column; gap: 2px; }
  .hotel b { font-weight: 500; font-size: 16px; }
  .hotel small { color: var(--muted); font-size: 13px; }
  .stars { color: #e0a43a; letter-spacing: 1px; }
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .row span:first-child { color: var(--muted); }
  .row.sum { border-bottom: 0; font-weight: 500; font-size: 15px; }
  .row.sum span:first-child { color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--pill); color: var(--on-pill); border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 500; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn svg.i { width: 14px; height: 14px; }
  .why { margin: 0; font-size: 14px; color: var(--muted); }

  /* Collapsible package rows */
  .pkgs { display: flex; flex-direction: column; gap: 10px; }
  details.pkg { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  details.pkg > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  details.pkg > summary::-webkit-details-marker { display: none; }
  details.pkg[open] > summary { border-bottom: 1px solid var(--line); }
  .pkg-thumb { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: var(--tile); flex: none; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .pkg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pkg-main .eyebrow { margin: 0; }
  .pkg-main b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pkg-main small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pkg-price { text-align: end; flex: none; display: flex; flex-direction: column; align-items: flex-end; }
  .pkg-price > span { font-weight: 300; font-size: 22px; line-height: 1.1; }
  .pkg-price small span { font-size: inherit; font-weight: 500; }
  .pkg-price small { font-size: 11px; color: var(--good); }
  .pkg-price small.over { color: var(--bad); }
  .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; flex: none; }
  details.pkg[open] .chev { transform: rotate(180deg); }
  details.pkg .card { border: 0; border-radius: 0; background: transparent; }
  .dates { font-size: 13px; color: var(--ink); background: var(--tile); border-radius: 12px; padding: 8px 12px; }

  /* Mode switch */
  .modes { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
  .mode { font: 500 13px var(--font); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; cursor: pointer; }
  .mode[aria-pressed="true"] { background: var(--pill); color: var(--on-pill); border-color: var(--pill); }
  .me .tag { display: block; font-size: 11px; opacity: .7; margin-bottom: 2px; }

  /* Matmid helper */
  .matmid { background: var(--tile); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .matmid b { font-weight: 500; }
  .calc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .calc label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .calc input { font: inherit; font-size: 16px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
  .calc-out { font-size: 14px; min-height: 1.5em; }

  /* Tap-to-answer questions */
  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .qlabel { font-weight: 500; margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { font: 400 15px var(--font); padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .opt[aria-pressed="true"] { background: var(--pill); color: var(--on-pill); border-color: var(--pill); }
  .qcard .pill-btn:disabled { opacity: .4; cursor: default; }

  /* Access code + composer */
  #codeForm { display: none; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-bottom: 14px; }
  #codeForm input { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #codeErr { color: var(--bad); font-size: 14px; min-height: 1em; }
  .composer { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 72%, transparent); }
  #f { display: flex; align-items: flex-end; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 6px; box-shadow: 0 6px 24px rgba(20,20,22,.08); }
  /* 16px: iPhone zooms the page into any text field smaller than that. */
  #t { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding: 9px 12px; resize: none; max-height: 140px; }
  #t:focus { outline: none; }
  .go { width: 44px; height: 44px; border-radius: 50%; background: var(--pill); color: var(--on-pill); display: grid; place-items: center; flex: none; border: 0; cursor: pointer; }
  .go:disabled { opacity: .4; cursor: default; }
  .pill-btn { font: 500 15px var(--font); padding: 12px 18px; border: 0; border-radius: 999px; background: var(--pill); color: var(--on-pill); cursor: pointer; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (min-width: 640px) { .hero { min-height: 220px; } .hero h1 { font-size: 38px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</svg>
<div class="wrap">
  <header class="top"><span class="logo ltr">ELO<b>TRAVEL</b></span></header>

  <form id="codeForm">
    <label for="code" id="codeLabel">Enter the access code to use the assistant</label>
    <input id="code" type="password" autocomplete="current-password" required>
    <button class="pill-btn" id="codeBtn">Continue</button>
    <div id="codeErr" role="alert"></div>
  </form>

  <div class="hero" id="hero"><h1 id="heroText">Flight + hotel,<br>within your budget.</h1></div>
  <div id="log" aria-live="polite"></div>

  <div class="composer">
    <div class="modes" id="modes" role="group" aria-label="Search mode"></div>
    <form id="f">
      <label for="t" class="hidden">Message</label>
      <textarea id="t" rows="1" dir="auto" enterkeyhint="enter" placeholder="Where to? / לאן טסים?" required></textarea>
      <button class="go" id="b" aria-label="Send"><svg class="i"><use href="#send"/></svg></button>
    </form>
  </div>
</div>

<script>
const log = document.getElementById('log'), form = document.getElementById('f'),
      input = document.getElementById('t'), btn = document.getElementById('b');
const codeForm = document.getElementById('codeForm'), codeInput = document.getElementById('code'),
      codeErr = document.getElementById('codeErr');
const preferHe = (navigator.language || '').toLowerCase().startsWith('he');
let sessionId = null, accessCode = '';
try { accessCode = localStorage.getItem('elotravel-code') || ''; } catch (e) {}

const T = {
  he: { greeting: 'היי! אמצא לך טיסה ומלון שמתאימים לתקציב. לאן טסים, בערך מתי, כמה נוסעים, ומה התקציב הכולל לטיסה ולמלון?',
        hero: 'טיסה ומלון,<br>בתקציב שלך.', code: 'הקלד את קוד הגישה כדי להשתמש בעוזר', cont: 'המשך', wrong: 'הקוד לא נכון, נסה שוב.',
        needCode: 'צריך להזין את קוד הגישה ואז לשלוח שוב.', thinking: 'חושב ומחפש…', flights: 'טיסות', hotel: 'מלון',
        out: 'הלוך', back: 'חזור', direct: 'ישירה', stops: n => n === 1 ? 'עצירה אחת' : n + ' עצירות',
        travelers: 'כולל טיסות ומלון', under: 'מתחת לתקציב', over: 'מעל התקציב', ofBudget: 'מהתקציב',
        perNight: 'ללילה', nights: n => 'סה״כ ' + n + ' לילות', rating: 'דירוג', stay: n => n + ' לילות',
        legroom: 'מרווח רגליים', aircraft: 'מטוס', duration: 'משך', stopsLbl: 'עצירות', total: 'סה״כ',
        flightsRow: 'טיסות הלוך־חזור', hotelRow: n => 'מלון, ' + n + ' לילות', viewFlights: 'צפייה ב-Google Flights',
        returnMissing: 'פרטי טיסת החזור זמינים בקישור', layover: 'המתנה', interrupted: 'החיבור נקטע. נסה שוב.',
        tooLong: 'זה לקח יותר מדי זמן. נסה שוב עם תאריכים מדויקים.', error: 'שגיאה: ',
        note: 'המחירים משתנים מהר, כדאי לוודא באתר לפני הזמנה.', reviews: 'ביקורות', round: 'הלוך־חזור',
        placeholder: 'לאן טסים?',
        modes: { package: 'חבילה', flight: 'טיסה', hotel: 'מלון', matmid: 'מתמיד אל על' },
        holders: { package: 'יעד, תאריכים, נוסעים ותקציב', flight: 'טיסה: מאיפה, לאן, מתי, כמה נוסעים',
                   hotel: 'מלון: עיר או אזור, תאריכים, כמה אורחים', matmid: 'טיסת אל על לכרטיס בונוס: לאן ומתי' },
        flightOnly: 'טיסות הלוך־חזור', hotelOnly: 'מלון לכל השהות',
        quota: 'המכסה החינמית של Gemini נגמרה לבינתיים. נסה שוב בעוד כמה דקות (או מחר אם זו המכסה היומית).' },
  en: { greeting: "Hi! I'll help you find a flight + hotel that fits your budget. Where are you flying from and to, roughly when, how many travelers, and what's your total budget for the flight and hotel together?",
        hero: 'Flight + hotel,<br>within your budget.', code: 'Enter the access code to use the assistant', cont: 'Continue', wrong: "That code isn't right. Try again.",
        needCode: 'Please enter the access code, then send your message again.', thinking: 'Thinking and searching…', flights: 'Flights', hotel: 'Hotel',
        out: 'Outbound', back: 'Return', direct: 'Direct', stops: n => n === 1 ? '1 stop' : n + ' stops',
        travelers: 'flights and hotel included', under: 'under budget', over: 'over budget', ofBudget: 'of budget',
        perNight: 'per night', nights: n => n + ' nights total', rating: 'Rating', stay: n => n + ' nights',
        legroom: 'Legroom', aircraft: 'Aircraft', duration: 'Duration', stopsLbl: 'Stops', total: 'Total',
        flightsRow: 'Round-trip flights', hotelRow: n => 'Hotel, ' + n + ' nights', viewFlights: 'View on Google Flights',
        returnMissing: 'Return flight details are on the link', layover: 'layover', interrupted: 'The connection was interrupted. Please try again.',
        tooLong: 'This took too long. Please try again with exact dates.', error: 'Error: ',
        note: 'Prices change quickly; check the final price on the site before booking.', reviews: 'reviews', round: 'Round trip',
        placeholder: 'Where to?',
        modes: { package: 'Package', flight: 'Flight', hotel: 'Hotel', matmid: 'El Al Matmid' },
        holders: { package: 'Destination, dates, travelers and budget', flight: 'Flight: from, to, when, how many',
                   hotel: 'Hotel: city or area, dates, guests', matmid: 'El Al award flight: where and when' },
        flightOnly: 'round-trip flights', hotelOnly: 'hotel for the whole stay',
        quota: "Gemini's free quota is used up for now. Try again in a few minutes (or tomorrow if it's the daily limit)." },
};
let L = preferHe ? T.he : T.en;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function safeUrl(u) { return typeof u === 'string' && /^https:\/\//.test(u) ? u : null; }
function md(text) {
  if (!window.marked || !window.DOMPurify) return '<div style="white-space:pre-wrap">' + esc(text) + '</div>';
  const tmp = document.createElement('div'); tmp.innerHTML = DOMPurify.sanitize(marked.parse(text));
  tmp.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  tmp.querySelectorAll('p, li, td, th').forEach(e => e.dir = 'auto');
  return tmp.innerHTML;
}
function scrollDown() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
function add(node) { log.appendChild(node); scrollDown(); return node; }
function money(v, cur, he) {
  if (typeof v !== 'number') return '—';
  try { return new Intl.NumberFormat(he ? 'he-IL' : 'en-US', { style: 'currency', currency: cur || 'USD', maximumFractionDigits: 0 }).format(v); }
  catch (e) { return Math.round(v) + ' ' + (cur || ''); }
}
function dur(min, he) {
  if (typeof min !== 'number') return '';
  const h = Math.floor(min / 60), m = min % 60;
  return he ? `${h} ש׳ ${m} ד׳` : `${h}h ${m}m`;
}
function hhmm(t) { return typeof t === 'string' && t.length >= 16 ? t.slice(11, 16) : (t || ''); }
function day(t, he) {
  if (typeof t !== 'string' || t.length < 10) return '';
  const d = new Date(t.slice(0, 10) + 'T12:00:00');
  return isNaN(d) ? '' : d.toLocaleDateString(he ? 'he-IL' : 'en-US', { weekday: 'short', day: 'numeric', month: 'short' });
}
function ltrSpan(text, cls) { const s = el('span', 'ltr ' + (cls || ''), text); return s; }

/* ---------- package cards ---------- */
function routeBlock(trip, label, he) {
  const frag = document.createDocumentFragment();
  const legs = (trip && trip.legs) || [];
  if (!legs.length) return frag;

    if (leg.depart_time && leg.arrive_time && leg.depart_time.slice(0, 10) !== leg.arrive_time.slice(0, 10)) t.appendChild(el('small', '', day(leg.arrive_time, he)));

  if (logo) { const img = el('img'); img.src = logo; img.alt = ''; img.loading = 'lazy'; img.onerror = () => img.replaceWith(el('span', 'mono', (out.airlines || [''])[0].slice(0, 2).toUpperCase())); carrier.appendChild(img); }
  else carrier.appendChild(el('span', 'mono', (out.airlines || [''])[0].slice(0, 2).toUpperCase()));
  const who = el('div'); who.appendChild(el('b', '', (out.airlines || []).join(', ')));
  const planes = [...new Set([...(out.legs || []), ...((ret && ret.legs) || [])].map(l => l.airplane).filter(Boolean))];
  const nums = [...(out.legs || []), ...((ret && ret.legs) || [])].map(l => l.flight_number).filter(Boolean);
  const sub = ltrSpan([nums.slice(0, 2).join(' / '), planes.join(', ')].filter(Boolean).join(' · ')); sub.style.cssText = 'color:var(--muted);font-size:12px';
  who.appendChild(sub); carrier.appendChild(who); fb.appendChild(carrier);
  fb.appendChild(routeBlock(out, L.out, he));
  if (ret) { fb.appendChild(el('div', 'sep')); fb.appendChild(routeBlock(ret, L.back, he)); }
  else fb.appendChild(el('span', 'leg-label', L.returnMissing));

  const links = h.links || {}; const ha = el('div', 'actions');

  if (ha.children.length) {

      hb.appendChild(el('div', 'dates', (he ? 'הקישורים פותחים חיפוש ל: ' : 'Links open a search for: ') + day(h.check_in, he) + ' – ' + day(h.check_out, he) + who));

  card.appendChild(hb);
  }

  // Sum
  const sb = el('div', 'block'); const rows = el('div', 'rows');
  [p.flight && [L.flightsRow, p.flight_price, ''], p.hotel && [L.hotelRow(p.nights || '?'), p.hotel_total, ''], [L.total, p.total, 'sum']].filter(Boolean).forEach(([k, v, c]) => {
    const r = el('div', 'row ' + c); r.appendChild(el('span', '', k)); r.appendChild(ltrSpan(money(v, cur, he), 'num')); rows.appendChild(r);
  });
  sb.appendChild(rows);
  const fl = p.flight && safeUrl(p.flight.results_link);
  if (fl) { const a = el('a', 'btn'); a.href = fl; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.append(L.viewFlights + ' '); a.insertAdjacentHTML('beforeend', '<svg class="i"><use href="#arrow"/></svg>'); const acts = el('div', 'actions'); acts.appendChild(a); sb.appendChild(acts); }
  if (p.why) sb.appendChild(el('p', 'why', p.why));
  sb.appendChild(el('p', 'why', L.note)).style.fontSize = '12px';
  card.appendChild(sb);
  return card;

let mode = 'package';
// Every visit starts in Package mode; the switch applies only until the page is reloaded.
try { localStorage.removeItem('elotravel-mode'); } catch (e) {}
if (!['package', 'flight', 'hotel', 'matmid'].includes(mode)) mode = 'package';
function renderModes() {
  const box = document.getElementById('modes'); box.innerHTML = '';
  ['package', 'flight', 'hotel', 'matmid'].forEach(m => {
    const b = el('button', 'mode', L.modes[m]); b.type = 'button'; b.setAttribute('aria-pressed', String(m === mode));
    b.addEventListener('click', () => { mode = m; renderModes(); input.focus(); });
    box.appendChild(b);
  });
  input.placeholder = L.holders[mode];
}

function questionsCard(qs, he) {
  const card = el('div', 'qcard'); card.dir = he ? 'rtl' : 'ltr';
  const answers = qs.map(() => null);
  const send = el('button', 'pill-btn', he ? 'שליחה' : 'Send'); send.type = 'button'; send.disabled = true;
  const isOther = o => /^(other|אחר)\b/i.test(o.trim());
  qs.forEach((q, i) => {
    const g = el('div'); g.appendChild(el('div', 'qlabel', q.question));
    const row = el('div', 'opts');
    q.options.forEach(o => {
      const b = el('button', 'opt', o); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => {
        row.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        if (isOther(o)) {            // free text: type it in the message box, then tap send
          answers[i] = null; input.placeholder = q.question; input.focus();
        } else answers[i] = o;
        send.disabled = answers.every(a => a === null) && !input.value.trim();
      });
      row.appendChild(b);
    });
    g.appendChild(row); card.appendChild(g);
  });
  input.addEventListener('input', () => { send.disabled = answers.every(a => a === null) && !input.value.trim(); });
  send.addEventListener('click', () => {
    const lines = qs.map((q, i) => answers[i] ? `${q.question} ${answers[i]}` : null).filter(Boolean);
    if (input.value.trim()) lines.push(input.value.trim());
    if (!lines.length) return;
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    input.value = lines.join('\n');
    form.requestSubmit();
  });
  card.appendChild(send);
  return card;
}

/* ---------- chat flow ---------- */
function setLang(he) {
  L = he ? T.he : T.en;
  document.documentElement.lang = he ? 'he' : 'en';
  document.getElementById('heroText').innerHTML = L.hero;
  document.getElementById('codeLabel').textContent = L.code;
  document.getElementById('codeBtn').textContent = L.cont;
  if (typeof renderModes === 'function' && document.getElementById('modes')) renderModes();
}
setLang(preferHe);
const greet = el('div', 'bot'); greet.dir = 'auto'; greet.innerHTML = md(L.greeting); log.appendChild(greet);

function saveCode(c) { accessCode = c; try { c ? localStorage.setItem('elotravel-code', c) : localStorage.removeItem('elotravel-code'); } catch (e) {} }
function askForCode(msg) { saveCode(''); codeErr.textContent = msg || ''; codeForm.style.display = 'flex'; form.classList.add('hidden'); codeInput.focus(); }
function showChat() { codeForm.style.display = 'none'; form.classList.remove('hidden'); }
fetch('/api/config').then(r => r.json()).then(cfg => { if (cfg.access_code_required && !accessCode) askForCode(); }).catch(() => {});
codeForm.addEventListener('submit', async e => {
  e.preventDefault();
  const c = codeInput.value.trim(); if (!c) return;
  const r = await fetch('/api/check-code', { method: 'POST', headers: { 'X-Access-Code': c } });
  if (r.ok) { saveCode(c); codeInput.value = ''; showChat(); input.focus(); } else askForCode(L.wrong);
});

function describe(ev, he) {
  const a = ev.args || {};
  if (ev.name === 'search_flights') return (he ? 'מחפש טיסות ' : 'Searching flights ') + (a.origin || '') + ' → ' + (a.dest || '') + (a.depart ? ' (' + a.depart + ')' : '');
  if (ev.name === 'search_hotels') return (he ? 'מחפש מלונות: ' : 'Searching hotels: ') + [a.query, a.area].filter(Boolean).join(', ');
  if (ev.name === 'get_return_flights') return he ? 'בודק טיסות חזור' : 'Checking return flights';
  if (ev.name === 'find_cheapest_dates') return (he ? 'בודק מחירים בכל התאריכים ' : 'Checking prices on every date ') + (a.date_from || '') + ' – ' + (a.date_to || '');
  if (ev.name === 'show_packages') return he ? 'מכין את החבילות' : 'Preparing your packages';
  return ev.name;
}

input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
// Enter adds a new line (phones included); the send button sends. Ctrl/Cmd+Enter also sends on a computer.
input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); } });
async function recover(turn, cards, he, stepLine) {
  stepLine(he ? 'החיבור נקטע. ממשיך לחכות לתשובה…' : 'The connection dropped. Still waiting for the answer…');
  for (let i = 0; i < 80; i++) {
    await new Promise(res => setTimeout(res, 3000));
    try {
      const r = await fetch(`/api/chat/result?session_id=${encodeURIComponent(sessionId)}&turn=${encodeURIComponent(turn)}`,
                            { headers: { 'X-Access-Code': accessCode } });
      if (r.status === 404) return null;
      if (!r.ok) continue;
      const rec = await r.json();
      if (rec.status === 'running') continue;
      cards.length = 0; cards.push(...(rec.packages || []));
      return rec.status === 'done' ? { type: 'reply', reply: rec.reply, questions: rec.questions } : { type: 'error', ...(rec.error || {}) };
    } catch (e) { /* still offline: keep trying */ }
  }
  return null;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  const he = /[֐-׿]/.test(text); setLang(he);
  document.getElementById('hero').classList.add('hidden');
  const sentMode = mode;
  const me = el('div', 'me'); me.dir = 'auto'; if (sentMode !== 'package') me.appendChild(el('span', 'tag', L.modes[sentMode])); me.append(text); add(me);
  input.value = ''; input.style.height = 'auto'; btn.disabled = true; input.placeholder = L.holders[mode];
  const wait = add(el('div', 'status'));
  const stepLine = t => { const s = el('div', 'step', t); wait.appendChild(s); scrollDown(); };
  stepLine(L.thinking);
  try {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 5 * 60 * 1000);
    const r = await fetch('/api/chat/stream', { method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': accessCode },
      body: JSON.stringify({ session_id: sessionId, message: text, mode: sentMode }) });
    if (r.status === 401) { clearTimeout(timer); wait.remove(); askForCode(L.needCode); input.value = text; return; }
    if (!r.ok) { clearTimeout(timer); let d = 'Request failed'; try { d = (await r.json()).detail || d; } catch (x) {} throw new Error(d); }
    let final = null, turn = null, questions = []; const cards = [];
    try {
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      while (!final) {
        const chunk = await reader.read(); if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1); if (!line) continue;
          const ev = JSON.parse(line);
          if (ev.type === 'start') { sessionId = ev.session_id; turn = ev.turn; }
          else if (ev.type === 'tool') stepLine(describe(ev, he));
          else if (ev.type === 'packages') cards.push(...(ev.packages || []));
          else if (ev.type === 'questions') questions = ev.questions || [];
          else if (ev.type === 'wait') stepLine(he ? `Gemini עמוס, ממתין ${ev.seconds} שניות…` : `Gemini is busy, waiting ${ev.seconds} s…`);
          else if (ev.type === 'reply' || ev.type === 'error') final = ev;
        }
      }
    } catch (netErr) {
      if (netErr.name === 'AbortError') throw netErr;  // our own 5-minute limit
    }
    clearTimeout(timer);
    // The connection dropped (screen locked, network switch…): the server keeps working, so fetch the result.
    if (!final && turn) { final = await recover(turn, cards, he, stepLine); if (final && final.questions) questions = final.questions; }
    if (!final) throw new Error(L.interrupted);
    if (final.type === 'error') throw new Error(final.status === 429 ? L.quota : final.message);
    wait.remove();
    if (final.reply) { const b = el('div', 'bot'); b.dir = 'auto'; b.innerHTML = md(final.reply); add(b); }
    if (questions.length) add(questionsCard(questions, he));
    if (cards.length) { const list = el('div', 'pkgs'); cards.slice(0, 3).forEach(p => list.appendChild(packageItem(p, he, sentMode))); add(list); }
  } catch (err) {
    wait.className = 'status error'; wait.textContent = L.error + (err.name === 'AbortError' ? L.tooLong : err.message);
  } finally { btn.disabled = false; input.focus(); }
});
