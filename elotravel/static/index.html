<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELOTRAVEL</title>
<!-- Bundled locally (marked 12.0.2, MIT; DOMPurify 3.1.6, Apache-2.0/MPL-2.0) so the page works without CDN access. -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#0b6bcb; --me:#e8f1fc; --border:#e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --text:#e6e8ec; --muted:#9aa3b2; --accent:#5aa6f0; --me:#1d2b3d; --border:#2a303b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100dvh; }
  header { font-weight:700; font-size:20px; padding:8px 0 12px; }
  header span { color:var(--muted); font-weight:400; font-size:14px; margin-inline-start:8px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:12px; }
  .msg { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px; max-width:92%; overflow-wrap:anywhere; }
  .msg.me { background:var(--me); align-self:flex-end; white-space:pre-wrap; }
  .msg p:first-child { margin-top:0 } .msg p:last-child { margin-bottom:0 }
  .msg a { color:var(--accent); }
  .msg table { border-collapse:collapse; display:block; overflow-x:auto; }
  .msg td, .msg th { border:1px solid var(--border); padding:4px 8px; }
  .status { color:var(--muted); font-size:14px; }
  form { display:flex; gap:8px; }
  textarea { flex:1; resize:none; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  button { font:inherit; padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #codeForm { display:none; flex-direction:column; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  #codeForm input { font:inherit; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  #codeForm button { padding:10px 18px; }
  #codeErr { color:#c0392b; font-size:14px; min-height:1em; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>ELOTRAVEL <span>flight + hotel search</span></header>
  <form id="codeForm">
    <label for="code">Enter the access code to use the assistant</label>
    <input id="code" type="password" autocomplete="current-password" required>
    <button>Continue</button>
    <div id="codeErr" role="alert"></div>
  </form>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <textarea id="t" rows="2" dir="auto" placeholder="Where to? / לאן טסים?" required></textarea>
    <button id="b">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), form = document.getElementById('f'),
      input = document.getElementById('t'), btn = document.getElementById('b');
let sessionId = null;
const codeForm = document.getElementById('codeForm'), codeInput = document.getElementById('code'),
      codeErr = document.getElementById('codeErr');
let accessCode = '';
try { accessCode = localStorage.getItem('elotravel-code') || ''; } catch (e) {}

function saveCode(c) {
  accessCode = c;
  try { c ? localStorage.setItem('elotravel-code', c) : localStorage.removeItem('elotravel-code'); } catch (e) {}
}
function askForCode(msg) {
  saveCode('');
  codeErr.textContent = msg || '';
  codeForm.style.display = 'flex'; form.classList.add('hidden'); codeInput.focus();
}
function showChat() { codeForm.style.display = 'none'; form.classList.remove('hidden'); }

fetch('/api/config').then(r => r.json()).then(cfg => {
  if (cfg.access_code_required && !accessCode) askForCode();
}).catch(() => {});

codeForm.addEventListener('submit', async e => {
  e.preventDefault();
  const c = codeInput.value.trim(); if (!c) return;
  const r = await fetch('/api/check-code', { method: 'POST', headers: {'X-Access-Code': c} });
  if (r.ok) { saveCode(c); codeInput.value = ''; showChat(); input.focus(); }
  else askForCode('That code is not right. Try again.');
});

function add(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.dir = 'auto'; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function md(text) {
  // If the Markdown libraries failed to load, show plain text rather than nothing.
  if (!window.marked || !window.DOMPurify) return '<div style="white-space:pre-wrap">' + esc(text) + '</div>';
  const html = DOMPurify.sanitize(marked.parse(text));
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  tmp.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  tmp.querySelectorAll('p, li, td, th').forEach(el => el.dir = 'auto');
  return tmp.innerHTML;
}
function describe(ev, he) {
  const a = ev.args || {};
  if (ev.name === 'search_flights')
    return (he ? 'מחפש טיסות ' : 'Searching flights ') + (a.origin || '') + ' → ' + (a.dest || '') + (a.depart ? ' (' + a.depart + ')' : '');
  if (ev.name === 'search_hotels')
    return (he ? 'מחפש מלונות: ' : 'Searching hotels: ') + [a.query, a.area].filter(Boolean).join(', ');
  if (ev.name === 'get_return_flights') return he ? 'בודק טיסות חזור' : 'Checking return flights';
  return ev.name;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

fetch('/api/greeting').then(r => r.json()).then(j => add('bot', md(j.reply)));

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  add('me', esc(text)); input.value = ''; btn.disabled = true;
  const he = /[\u0590-\u05FF]/.test(text);
  const wait = add('bot status', he ? 'חושב ומחפש… זה יכול לקחת עד דקה או שתיים.' : 'Thinking and searching… this can take a minute or two.');
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5 * 60 * 1000);
    const r = await fetch('/api/chat/stream', { method: 'POST', signal: ctrl.signal,
      headers: {'Content-Type': 'application/json', 'X-Access-Code': accessCode},
      body: JSON.stringify({ session_id: sessionId, message: text }) });
    if (r.status === 401) {
      clearTimeout(timer); wait.remove();
      askForCode(he ? 'צריך להזין את קוד הגישה ואז לשלוח שוב.' : 'Please enter the access code, then send your message again.');
      input.value = text; return;
    }
    if (!r.ok) {
      clearTimeout(timer);
      let detail = 'Request failed'; try { detail = (await r.json()).detail || detail; } catch (e) {}
      throw new Error(detail);
    }
    const steps = [];
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', done = false, final = null;
    while (!done) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'start') sessionId = ev.session_id;
        else if (ev.type === 'tool') {
          steps.push(describe(ev, he));
          wait.innerHTML = steps.map(s => '<div>• ' + esc(s) + '</div>').join('');
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === 'reply' || ev.type === 'error') { final = ev; done = true; }
      }
    }
    clearTimeout(timer);
    if (!final) throw new Error(he ? 'החיבור נקטע. נסה שוב.' : 'The connection was interrupted. Please try again.');
    if (final.type === 'error') throw new Error(final.message);
    wait.remove(); add('bot', md(final.reply));
  } catch (err) {
    const msg = err.name === 'AbortError' ? 'This took too long. Please try again with exact dates.' : err.message;
    wait.className = 'msg bot status'; wait.textContent = 'Error: ' + msg;
  } finally { btn.disabled = false; input.focus(); }
});
</script>
</body>
</html>
